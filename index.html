<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Учёт личных финансов</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="container">
  <h1>Учёт личных финансов</h1>

  <div class="card">
    <h2>Добавить транзакцию</h2>

    <form id="transaction-form">

      <div>
        <label>Сумма</label>
        <input type="number" id="amount" placeholder="Например: -250">
      </div>

      <div>
        <label>Категория</label>

        <select id="category">
          <option value="">Выберите категорию</option>
          <option>Еда</option>
          <option>Транспорт</option>
          <option>Зарплата</option>
          <option>Развлечения</option>
          <option>Прочее</option>
        </select>
      </div>

      <div class="full-width">
        <label>Описание</label>
        <input type="text" id="description" placeholder="Описание">
      </div>

      <button type="submit">
        Добавить транзакцию
      </button>

    </form>
  </div>

  <div class="card">

    <h2>Список транзакций</h2>

    <p id="total" class="total">
      Итого: 0 MDL
    </p>

    <table id="transactions-table">

      <thead>
        <tr>
          <th>Дата</th>
          <th>Категория</th>
          <th>Описание</th>
          <th>Удалить</th>
        </tr>
      </thead>

      <tbody></tbody>

    </table>

  </div>

  <div id="transaction-details"></div>

</div>

<script type="module" src="src/index.js"></script>

</body>
</html>
